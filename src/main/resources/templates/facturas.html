<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('ETIA — Mis Facturas')}"></head>
<body>

<header th:replace="~{fragments/header :: header(backUrl='/documents', backLabel='Documentos')}"></header>

<div class="screen">
    <div class="container">
        <div class="menu-title">
            <h2>🧾 Mis Facturas</h2>
            <p>Facturas electrónicas emitidas — Serie F001+</p>
        </div>

        <div class="view-toolbar">
            <div class="vt-actions">
                <a th:href="@{/wizard(type='FACTURA')}" class="btn btn-accent">✨ Crear Factura</a>
            </div>
        </div>

        <div class="panel active">
            <div id="doc-content">
                <p class="pm-empty">⏳ Cargando facturas...</p>
            </div>
            <div id="doc-pag" class="pag-bar" style="display:none;"></div>
        </div>
    </div>
</div>

<!-- Config Overlay -->
<div th:replace="~{fragments/config-overlay :: configOverlay}"></div>
<!-- Document Preview Modal -->
<div th:replace="~{fragments/doc-preview :: docPreviewModal}"></div>

<script th:src="@{/js/api-client.js}"></script>
<script th:src="@{/js/app-state.js}"></script>
<script th:src="@{/js/error-handler.js}"></script>
<script th:src="@{/js/navigation.js}"></script>
<script th:src="@{/js/config-overlay.js}"></script>
<script th:src="@{/js/doc-preview.js}"></script>
<script>
    var allDocs = [], currentPage = 0, PAGE_SIZE = 10;

    document.addEventListener('DOMContentLoaded', function() {
        ETIA.init().then(function() { loadDocs(); });
    });

    function renderItemDetail(detalle) {
        if (!detalle || detalle.length === 0) return '';
        var html = '<div class="doc-item-detail">';
        detalle.forEach(function(it) {
            html += '<div class="doc-item-chip">' +
                '<span class="dic-desc">' + (it.descripcion || '—') + '</span>' +
                '<span class="dic-meta">×' + (it.cantidad || 1) + '</span>' +
                '<span class="dic-amount">S/ ' + parseFloat(it.subtotal || 0).toFixed(2) + '</span>' +
                '</div>';
        });
        return html + '</div>';
    }

    function loadDocs() {
        ApiClient.listarFacturas(ETIA.companyId).then(function(docs) {
            allDocs = docs || [];
            currentPage = 0;
            renderPage();
        }).catch(function() {
            document.getElementById('doc-content').innerHTML = '<p class="pm-empty" style="color:var(--danger);">❌ Error cargando facturas</p>';
        });
    }

    function renderPage() {
        var total = allDocs.length;
        var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage >= totalPages) currentPage = totalPages - 1;
        var start = currentPage * PAGE_SIZE;
        var pageItems = allDocs.slice(start, start + PAGE_SIZE);
        if (total === 0) {
            document.getElementById('doc-content').innerHTML = '<p class="pm-empty">📭 No hay facturas emitidas aún</p>';
            document.getElementById('doc-pag').style.display = 'none';
            return;
        }
        var html = '<div class="doc-list-cards">';
        pageItems.forEach(function(d) {
            var estado = d.estado || '—';
            var badgeMap = { 'BORRADOR': 'badge-gray', 'ENVIADA': 'badge-blue', 'ACEPTADA': 'badge-green', 'RECHAZADA': 'badge-red', 'ANULADA': 'badge-yellow' };
            var badgeCls = badgeMap[estado] || 'badge-gray';
            var monSym = (d.moneda === 'USD' || d.moneda === 'usd') ? 'US$ ' : 'S/ ';
            var strikeStyle = estado === 'ANULADA' ? 'text-decoration:line-through;opacity:0.6;' : '';

            /* ─── State-driven inline actions ─── */
            var actions = '';
            /* Export actions — always JSON; XML+PDF for transmitted (post-BORRADOR) */
            var exports = '<button class="dli-action dli-action-json" onclick="event.stopPropagation();quickJson(\'' + d.id + '\');">📋 JSON</button>';
            if (estado !== 'BORRADOR' && estado !== '—') {
                exports += '<button class="dli-action dli-action-xml" onclick="event.stopPropagation();quickXml(\'' + d.id + '\',this);">📥 XML</button>' +
                           '<button class="dli-action dli-action-pdf" onclick="event.stopPropagation();quickPdf(\'' + d.id + '\');">📄 PDF</button>';
            }
            switch (estado) {
                case 'BORRADOR':
                    actions = '<a class="dli-action dli-action-edit" href="/wizard?type=FACTURA" onclick="event.stopPropagation();">✏️ Editar</a>' +
                              '<button class="dli-action dli-action-emit" onclick="event.stopPropagation();quickEmit(\'' + d.id + '\',this);">📤 Emitir</button>' +
                              '<button class="dli-action dli-action-delete" onclick="event.stopPropagation();quickDelete(\'' + d.id + '\',\'' + (d.serie||'') + '-' + (d.numero||'') + '\',this);">🗑️</button>';
                    break;
                case 'ENVIADA':
                    actions = '<button class="dli-action dli-action-annul" onclick="event.stopPropagation();quickAnular(\'' + d.id + '\',\'' + (d.serie||'') + '-' + (d.numero||'') + '\',this);">🚫 Anular</button>';
                    break;
                case 'ACEPTADA':
                    actions = '<button class="dli-action dli-action-annul" onclick="event.stopPropagation();quickAnular(\'' + d.id + '\',\'' + (d.serie||'') + '-' + (d.numero||'') + '\',this);">🚫 Anular</button>';
                    break;
                case 'RECHAZADA':
                    actions = '<a class="dli-action dli-action-edit" href="/wizard?type=FACTURA" onclick="event.stopPropagation();">🔧 Corregir</a>';
                    break;
                /* ANULADA: no workflow actions, but exports still available */
            }

            html += '<div class="doc-list-item" onclick="openDocPreview(\'factura\',\'' + d.id + '\')" style="cursor:pointer;' + (estado === 'ANULADA' ? 'opacity:0.7;' : '') + '">' +
                '<div class="dli-header">' +
                    '<div class="dli-left">' +
                        '<strong class="dli-serie">' + (d.serie||'') + '-' + (d.numero||'') + '</strong>' +
                        '<span class="badge ' + badgeCls + '">' + estado + '</span>' +
                    '</div>' +
                    '<div class="dli-right">' +
                        '<span class="dli-total">' + monSym + (parseFloat(d.total)||0).toFixed(2) + '</span>' +
                        '<span class="dli-date">' + ETIA.formatDate(d.fechaEmision||d.fechaCreacion) + '</span>' +
                    '</div>' +
                '</div>' +
                renderItemDetail(d.detalle) +
                '<div class="dli-actions">' +
                    '<div class="dli-actions-export">' + exports + '</div>' +
                    (actions ? '<div class="dli-actions-workflow">' + actions + '</div>' : '') +
                '</div>' +
            '</div>';
        });
        html += '</div>';
        document.getElementById('doc-content').innerHTML = html;
        renderPagination(total, totalPages);
    }

    function goToPage(p) { currentPage = p; renderPage(); }

    /* ─── Quick actions from the list ─── */
    function quickEmit(facturaId, btn) {
        if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        ApiClient.getFactura(facturaId).then(function(doc) {
            if (!doc) throw new Error('not found');
            var payload = {
                companyId: doc.companyId || ETIA.companyId,
                clientId: doc.clientId || null,
                serie: doc.serie || null,
                moneda: doc.moneda || 'PEN',
                formaPago: doc.formaPago || 'CONTADO',
                gravadas: doc.gravadas || 0,
                igv: doc.igv || 0,
                total: doc.total || 0,
                detalle: doc.detalle || []
            };
            return ApiClient.emitirFactura(payload);
        }).then(function() {
            if (ETIA.showSuccess) ETIA.showSuccess('Factura emitida exitosamente');
            loadDocs();
        }).catch(function() {
            if (btn) { btn.disabled = false; btn.textContent = '📤 Emitir'; }
        });
    }

    function quickAnular(facturaId, serie, btn) {
        if (!confirm('¿Anular la factura ' + serie + '? Esta acción no se puede deshacer.')) return;
        if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        ApiClient.anularFactura(facturaId, { motivoAnulacion: 'Anulación solicitada por el usuario' })
            .then(function() {
                if (ETIA.showSuccess) ETIA.showSuccess('Factura ' + serie + ' anulada');
                loadDocs();
            }).catch(function() {
                if (btn) { btn.disabled = false; btn.textContent = '🚫 Anular'; }
            });
    }

    function quickDelete(facturaId, serie, btn) {
        if (!confirm('¿Eliminar el borrador ' + serie + '? No se puede deshacer.')) return;
        if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        ApiClient.eliminarFactura(facturaId).then(function() {
            if (ETIA.showSuccess) ETIA.showSuccess('Borrador ' + serie + ' eliminado');
            loadDocs();
        }).catch(function() {
            if (btn) { btn.disabled = false; btn.textContent = '🗑️'; }
        });
    }

    function quickXml(facturaId, btn) {
        if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        ApiClient.descargarFacturaXml(facturaId).then(function(result) {
            if (!result) {
                if (ETIA.showError) ETIA.showError({ message: 'Esta factura aún no tiene XML generado.' });
                if (btn) { btn.disabled = false; btn.textContent = '📥 XML'; }
                return;
            }
            var a = document.createElement('a');
            a.href = URL.createObjectURL(result.blob);
            a.download = result.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            if (btn) { btn.disabled = false; btn.textContent = '📥 XML'; }
        }).catch(function() {
            if (btn) { btn.disabled = false; btn.textContent = '📥 XML'; }
        });
    }

    function quickJson(facturaId) {
        ApiClient.getFactura(facturaId).then(function(doc) {
            if (!doc) return;
            var serie = (doc.serie || 'F001') + '-' + (doc.numero || facturaId);
            var json = JSON.stringify(doc, null, 2);
            var blob = new Blob([json], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = serie + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            if (ETIA.showSuccess) ETIA.showSuccess('JSON descargado: ' + serie + '.json');
        });
    }

    function quickPdf(facturaId) {
        ApiClient.getFactura(facturaId).then(function(doc) {
            if (!doc) return;
            /* Reuse preview PDF via DocPreview (open preview then export) */
            openDocPreview('factura', facturaId);
            /* Wait for data load, then trigger PDF */
            var tries = 0;
            var interval = setInterval(function() {
                tries++;
                if (DocPreview.exportPdf && document.getElementById('dp-body').children.length > 1) {
                    clearInterval(interval);
                    setTimeout(function() { DocPreview.exportPdf(); }, 200);
                }
                if (tries > 20) clearInterval(interval);
            }, 150);
        });
    }

    function renderPagination(total, totalPages) {
        var bar = document.getElementById('doc-pag');
        bar.style.display = 'flex';
        var s = currentPage * PAGE_SIZE + 1, e = Math.min((currentPage + 1) * PAGE_SIZE, total);
        var html = '<div class="pag-info"><span class="badge badge-green">' + total + ' factura' + (total !== 1 ? 's' : '') + '</span> Mostrando ' + s + '–' + e + '</div>';
        html += '<div class="pag-controls">';
        html += '<button class="pag-btn" onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 0 ? 'disabled' : '') + '>‹</button>';
        for (var i = 0; i < totalPages; i++) {
            if (totalPages > 7 && Math.abs(i - currentPage) > 2 && i !== 0 && i !== totalPages - 1) { if (i === 1 || i === totalPages - 2) html += '<span class="pag-btn" style="border:none;cursor:default;">…</span>'; continue; }
            html += '<button class="pag-btn' + (i === currentPage ? ' pag-active' : '') + '" onclick="goToPage(' + i + ')">' + (i + 1) + '</button>';
        }
        html += '<button class="pag-btn" onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages - 1 ? 'disabled' : '') + '>›</button>';
        html += '</div>';
        bar.innerHTML = html;
    }
</script>
</body>
</html>
