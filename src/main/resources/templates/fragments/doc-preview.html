<!-- Document Preview Modal Fragment -->
<div th:fragment="docPreviewModal" class="doc-preview-overlay" id="doc-preview-overlay" onclick="if(event.target===this)closeDocPreview()">
    <div class="doc-preview-card">
        <div class="dp-header">
            <div class="dp-header-left">
                <h2 id="dp-title">📄 Documento</h2>
                <div class="dp-subtitle" id="dp-subtitle"></div>
            </div>
            <button class="dp-close" onclick="closeDocPreview()">✕</button>
        </div>
        <!-- Status banner — shown for RECHAZADA -->
        <div id="dp-status-banner" style="display:none;"></div>
        <div class="dp-body" id="dp-body">
            <p class="pm-spinner">⏳ Cargando documento...</p>
        </div>
        <div class="dp-footer" id="dp-footer" style="display:none;">
            <!-- Export buttons (left) -->
            <div class="dp-export-group" id="dp-export-buttons">
                <button id="dp-json-btn" class="btn-export" style="display:none;" onclick="dpExportJson()">📋 JSON</button>
                <button id="dp-xml-btn" class="btn-export" style="display:none;" onclick="dpDescargarXml()">📥 XML</button>
                <button id="dp-pdf-btn" class="btn-export" style="display:none;" onclick="dpExportPdf()">📄 PDF</button>
                <button id="dp-duplicate-btn" class="btn-export" style="display:none;" onclick="dpShowDuplicateOptions()">📄 Duplicar</button>
            </div>
            <!-- Duplicate options dropdown -->
            <div id="dp-dup-options" style="display:none;position:absolute;bottom:70px;left:16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem;z-index:50;min-width:220px;box-shadow:0 4px 20px rgba(0,0,0,0.3);">
                <p style="font-weight:600;margin:0 0 0.5rem;font-size:0.85rem;">📄 Duplicar — ¿Qué copiar?</p>
                <label style="display:block;font-size:0.8rem;margin-bottom:0.3rem;cursor:pointer;"><input type="checkbox" id="dp-dup-cliente" checked/> 👤 Cliente</label>
                <label style="display:block;font-size:0.8rem;margin-bottom:0.3rem;cursor:pointer;"><input type="checkbox" id="dp-dup-detalle" checked/> 📋 Detalle (ítems)</label>
                <label style="display:block;font-size:0.8rem;margin-bottom:0.3rem;cursor:pointer;"><input type="checkbox" id="dp-dup-cuotas"/> 💳 Cuotas</label>
                <label style="display:block;font-size:0.8rem;margin-bottom:0.5rem;cursor:pointer;"><input type="checkbox" id="dp-dup-cargos"/> 📊 Cargos/Descuentos</label>
                <button class="btn btn-accent" style="width:100%;font-size:0.8rem;" onclick="dpExecuteDuplicate()">✨ Crear Clon</button>
            </div>
            <!-- Action buttons (right) -->
            <div class="dp-action-group" id="dp-action-buttons">
                <a id="dp-edit-btn" class="btn btn-accent" style="display:none;">✏️ Editar</a>
                <button id="dp-validate-btn" class="btn btn-ghost" style="display:none;border-color:var(--info);color:var(--info);" onclick="dpValidarDoc()">🔍 Validar</button>
                <button id="dp-emit-btn" class="btn btn-accent" style="display:none;" onclick="dpEmitirFactura()">📤 Emitir</button>
                <button id="dp-annul-btn" class="btn btn-ghost" style="display:none;border-color:var(--danger);color:var(--danger);" onclick="dpAnularFactura()">🚫 Anular</button>
                <button id="dp-delete-btn" class="btn btn-ghost" style="display:none;border-color:var(--danger);color:var(--danger);" onclick="dpEliminarFactura()">🗑️ Eliminar</button>
            </div>
        </div>
    </div>
</div>
