<!-- ═══════ ETIA — Header Fragment ═══════ -->
<header th:fragment="header(backUrl, backLabel, breadcrumb)" class="g-header"
        xmlns:th="http://www.thymeleaf.org">

    <!-- ═══ LEFT: Logo + Breadcrumb ═══ -->
    <div class="g-header-left">
        <a th:href="@{/menu}" class="g-brand-link" title="Ir al menú">
            <span class="g-logo" id="hdr-logo">
                <img id="hdr-logo-img" class="g-logo-img" style="display:none;" alt="Logo"/>
                <img id="hdr-logo-emoji" th:src="@{/favicon.svg}" class="g-logo-svg" alt="ETIA" style="width:28px;height:28px;"/>
            </span>
        </a>
        <nav class="g-breadcrumb" id="hdr-breadcrumb" th:if="${breadcrumb != null}">
            <span class="g-bc-sep">▸</span>
            <a th:if="${backUrl != null}" th:href="@{__${backUrl}__}" class="g-bc-item"
               th:text="${backLabel} ?: 'Menú'">Menú</a>
            <span th:if="${backUrl != null}" class="g-bc-sep">▸</span>
            <span class="g-bc-current"><span class="g-bc-dot"></span><span th:text="${breadcrumb}">Página</span></span>
        </nav>
        <span th:if="${breadcrumb == null}" class="g-bc-brand">ETIA <sub style="font-size:.55rem;color:var(--text-muted);">v0.1.0</sub></span>
    </div>

    <!-- ═══ RIGHT: Company · Sede · 🔔 · ⚙️ · Logout ═══ -->
    <div class="g-header-right">
        <span class="g-company-name" id="hdr-company">EMPRESA</span>
        <div class="g-sede-wrap">
            <select class="g-sede-select" id="hdr-sede-select" title="Sede activa">
                <option value="">Cargando sedes…</option>
            </select>
        </div>
        <!-- TC Live Badge -->
        <div class="g-tc-wrap">
            <button class="g-tc-badge" id="hdr-tc-badge" onclick="toggleTcPopup()" title="Tipo de Cambio del día" style="display:none;">
                <span class="g-tc-icon">💱</span>
                <span class="g-tc-rate tc-badge-rate">—</span>
            </button>
            <div class="g-tc-popup" id="hdr-tc-popup" style="display:none;">
                <div class="g-tc-popup-title">💱 Tipo de Cambio · USD/PEN</div>
                <div class="g-tc-popup-row">
                    <span class="g-tc-popup-label">📈 Compra</span>
                    <span class="g-tc-popup-val tc-popup-compra">—</span>
                </div>
                <div class="g-tc-popup-row">
                    <span class="g-tc-popup-label">📉 Venta</span>
                    <span class="g-tc-popup-val g-tc-popup-val-accent tc-popup-venta">—</span>
                </div>
                <div class="g-tc-popup-footer tc-popup-fuente">SBS · —</div>
                <button class="g-tc-popup-refresh" onclick="refreshTcBadge()">⟳ Actualizar</button>
            </div>
        </div>
        <button class="g-notif-btn" id="hdr-notif-btn" onclick="toggleNotifPanel()" title="Notificaciones">
            🔔 <span class="g-notif-count" id="hdr-notif-count" style="display:none;">0</span>
        </button>
        <button class="g-config-btn" onclick="openConfigOverlay()" title="Configuración">⚙️</button>
        <a th:href="@{/}" class="g-logout" title="Cerrar sesión">🔓 Salir</a>
    </div>

    <!-- ═══ Notification Panel (hidden by default) ═══ -->
    <div class="g-notif-panel" id="hdr-notif-panel" style="display:none;">
        <div class="g-notif-header">
            <span>🔔 Notificaciones</span>
            <div style="display:flex;gap:0.4rem;align-items:center;">
                <button class="g-notif-action-btn" onclick="markAllNotifsRead()" title="Marcar todas como leídas">✓ Leídas</button>
                <button class="g-notif-action-btn" onclick="clearAllNotifs()" title="Limpiar notificaciones">🗑️</button>
                <button class="g-notif-close" onclick="toggleNotifPanel()">✕</button>
            </div>
        </div>
        <!-- Config pending section -->
        <div class="g-notif-section" id="hdr-notif-config" style="display:none;">
            <div class="g-notif-section-title">⚙️ Configuración pendiente</div>
            <div class="g-notif-list" id="hdr-notif-config-list"></div>
        </div>
        <div class="g-notif-section" id="hdr-notif-transmissions">
            <div class="g-notif-section-title">📤 Transmisiones recientes</div>
            <div class="g-notif-list" id="hdr-notif-tx-list"></div>
        </div>
        <div class="g-notif-section" id="hdr-notif-rejected">
            <div class="g-notif-section-title">⚠️ Comprobantes rechazados</div>
            <div class="g-notif-list" id="hdr-notif-list"></div>
        </div>
    </div>
</header>
