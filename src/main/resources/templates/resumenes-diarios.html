<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('ETIA — Resúmenes Diarios')}"></head>
<body>

<header th:replace="~{fragments/header :: header(backUrl='/menu', backLabel='Menú', breadcrumb='Resúmenes Diarios')}"></header>

<div class="screen">
    <div class="container">
        <div class="menu-title">
            <h2>📑 Resúmenes Diarios de Boletas</h2>
            <p>Consolidación diaria de boletas VALIDADAS para envío masivo a SUNAT</p>
        </div>

        <!-- Toolbar -->
        <div class="view-toolbar">
            <div class="vt-search-wrap">
                <input class="vt-search" id="rd-fecha" type="date" title="Fecha de referencia para el resumen" />
            </div>
            <div class="vt-actions">
                <button class="btn btn-accent" id="btn-generar" onclick="generarResumen()">✨ Generar Resumen del Día</button>
            </div>
        </div>

        <!-- Info banner -->
        <div id="rd-info" class="warn-banner" style="margin-bottom:1rem;">
            ℹ️ Genera un resumen diario para enviar boletas VALIDADAS a SUNAT. Selecciona una fecha o usa la de hoy.
        </div>

        <!-- List -->
        <div id="rd-content">
            <p class="pm-empty">⏳ Cargando resúmenes...</p>
        </div>
    </div>
</div>

<!-- Config Overlay -->
<div th:replace="~{fragments/config-overlay :: configOverlay}"></div>

<script th:src="@{/js/api-client.js}"></script>
<script th:src="@{/js/app-state.js}"></script>
<script th:src="@{/js/error-handler.js}"></script>
<script th:src="@{/js/navigation.js}"></script>
<script th:src="@{/js/config-overlay.js}"></script>
<script>
    var allResumenes = [];

    document.addEventListener('DOMContentLoaded', function() {
        ETIA.init().then(function() {
            var today = new Date().toISOString().split('T')[0];
            document.getElementById('rd-fecha').value = today;
            loadResumenes();
        });
    });

    function loadResumenes() {
        if (!ETIA.companyId) return;
        ApiClient.listarResumenesDiarios(ETIA.companyId).then(function(list) {
            allResumenes = list || [];
            renderResumenes();
        }).catch(function(err) {
            document.getElementById('rd-content').innerHTML =
                '<p class="pm-empty" style="color:var(--danger);">❌ Error cargando resúmenes: ' + (err.message || '') + '</p>';
        });
    }

    function renderResumenes() {
        var container = document.getElementById('rd-content');
        if (allResumenes.length === 0) {
            container.innerHTML = '<p class="pm-empty">📭 No hay resúmenes diarios aún. Genera uno usando el botón de arriba.</p>';
            return;
        }

        var html = '<div class="doc-list-cards">';
        allResumenes.forEach(function(r) {
            var estado = r.estado || '—';
            var badgeMap = {
                'GENERADO': 'badge-gray', 'ENVIADO': 'badge-blue',
                'ACEPTADO': 'badge-green', 'RECHAZADO': 'badge-red', 'CON_ERROR': 'badge-red'
            };
            var badgeCls = badgeMap[estado] || 'badge-gray';
            var estadoIcon = { 'GENERADO': '📝', 'ENVIADO': '📨', 'ACEPTADO': '✅', 'RECHAZADO': '❌', 'CON_ERROR': '⚠' };
            var icon = estadoIcon[estado] || '';
            var fechaGen = r.fechaGeneracion ? ETIA.formatDate(r.fechaGeneracion) : '—';
            var fechaRef = r.fechaReferencia ? ETIA.formatDate(r.fechaReferencia) : '—';

            /* Actions */
            var actions = '';
            if (estado === 'ENVIADO') {
                actions += '<button class="dli-action dli-action-validate" onclick="event.stopPropagation();consultarEstado(\'' + r.id + '\',this);">🔍 Consultar Estado</button>';
            }
            actions += '<button class="dli-action dli-action-json" onclick="event.stopPropagation();verDetalle(\'' + r.id + '\');">📋 Ver Detalle</button>';

            /* Response info */
            var respInfo = '';
            if (r.descripcionRespuesta) {
                var respColor = estado === 'ACEPTADO' ? 'var(--success,#16a34a)' : 'var(--danger,#dc2626)';
                respInfo = '<div style="margin-top:4px;padding:6px 10px;background:' + (estado === 'ACEPTADO' ? '#f0fdf4' : '#fef2f2') + ';border-radius:6px;font-size:.8rem;color:' + respColor + ';">' +
                    (r.codigoRespuesta ? 'Código ' + r.codigoRespuesta + ': ' : '') + r.descripcionRespuesta + '</div>';
            }

            html += '<div class="doc-list-item" id="rd-' + r.id + '" style="cursor:pointer;" onclick="verDetalle(\'' + r.id + '\')">' +
                '<div class="dli-header">' +
                    '<div class="dli-left">' +
                        '<strong class="dli-serie" style="color:var(--purple);">' + (r.identificador || r.id) + '</strong>' +
                        '<span class="badge ' + badgeCls + '">' + icon + ' ' + estado + '</span>' +
                        '<span class="badge badge-gray">📦 ' + (r.cantidadBoletas || 0) + ' boleta(s)</span>' +
                    '</div>' +
                    '<div class="dli-right">' +
                        '<span class="dli-date">Gen: ' + fechaGen + '</span>' +
                        '<span class="dli-date">Ref: ' + fechaRef + '</span>' +
                    '</div>' +
                '</div>' +
                (r.ticketSunat ? '<div style="font-size:.78rem;color:var(--text-muted);margin-top:2px;">🎫 Ticket: ' + r.ticketSunat + '</div>' : '') +
                respInfo +
                '<div class="dli-actions">' +
                    '<div class="dli-actions-workflow">' + actions + '</div>' +
                '</div>' +
            '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
    }

    function generarResumen() {
        var fecha = document.getElementById('rd-fecha').value;
        var btn = document.getElementById('btn-generar');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Generando...'; }

        var payload = { companyId: ETIA.companyId };
        if (fecha) payload.fechaReferencia = fecha;

        ApiClient.crearResumenDiario(payload).then(function(res) {
            var data = (res && res.data) ? res.data : res;
            var id = data ? (data.identificador || data.id) : '';
            var cant = data ? data.cantidadBoletas : 0;
            if (ETIA.showSuccess) ETIA.showSuccess('✅ Resumen ' + id + ' generado — ' + cant + ' boleta(s) incluidas');
            loadResumenes();
        }).catch(function(err) {
            /* Error already shown by _handleResponse */
        }).finally(function() {
            if (btn) { btn.disabled = false; btn.textContent = '✨ Generar Resumen del Día'; }
        });
    }

    function consultarEstado(resumenId, btn) {
        if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        ApiClient.consultarEstadoResumen(resumenId).then(function(res) {
            var data = (res && res.data) ? res.data : res;
            if (data && data.exitoso) {
                if (ETIA.showSuccess) ETIA.showSuccess('✅ Estado: ' + (data.estado || 'OK') + ' — ' + (data.descripcionRespuesta || ''));
            } else {
                if (ETIA.showError) ETIA.showError({ message: '⚠ ' + (data.estado || '') + ': ' + (data.descripcionRespuesta || 'Error en consulta') });
            }
            loadResumenes();
        }).catch(function() {
            if (btn) { btn.disabled = false; btn.textContent = '🔍 Consultar Estado'; }
        });
    }

    function verDetalle(resumenId) {
        ApiClient.obtenerResumenDiario(resumenId).then(function(data) {
            if (!data) return;
            var json = JSON.stringify(data, null, 2);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(json).then(function() {
                    if (ETIA.showSuccess) ETIA.showSuccess('Detalle del resumen copiado al portapapeles');
                });
            } else {
                var w = window.open('', '_blank');
                w.document.write('<pre>' + json.replace(/</g,'&lt;') + '</pre>');
            }
        });
    }
</script>
</body>
</html>
