  # ==================== SERIE CONFIG ====================
  /serie_config:
    get:
      tags:
        - serie_config
      summary: Listar configuración de series por empresa
      operationId: listarSeriesConfig
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: tipoDocumento
          in: query
          schema:
            type: string
            enum: [FACTURA, BOLETA, NOTA_CREDITO, NOTA_DEBITO]
          description: Filtrar por tipo de documento
      responses:
        "200":
          description: Lista de series configuradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerieConfigData'

  # ==================== SEDE ====================
  /sede:
    get:
      tags:
        - sede
      summary: Listar sedes por empresa
      operationId: listarSedes
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
            enum: [ACTIVO, INACTIVO]
      responses:
        "200":
          description: Lista de sedes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeListResponseDto'

    post:
      tags:
        - sede
      summary: Crear nueva sede
      operationId: crearSede
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SedeCreateDto'
      responses:
        "200":
          description: Sede creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeResponseDto'
        "400":
          description: Error de validación

    put:
      tags:
        - sede
      summary: Actualizar sede
      operationId: actualizarSede
      parameters:
        - name: sedeId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SedeUpdateDto'
      responses:
        "200":
          description: Sede actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeResponseDto'
        "404":
          description: Sede no encontrada

    delete:
      tags:
        - sede
      summary: Eliminar sede (soft delete)
      operationId: eliminarSede
      parameters:
        - name: sedeId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sede eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          description: Sede no encontrada

  /sede/{sedeId}:
    get:
      tags:
        - sede
      summary: Obtener sede por ID
      operationId: obtenerSede
      parameters:
        - name: sedeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sede encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeResponseDto'
        "404":
          description: Sede no encontrada

  /sede/{sedeId}/generar_series:
    post:
      tags:
        - sede
      summary: Generar series automáticas para una sede (F, B, FC, FD)
      operationId: generarSeriesSede
      parameters:
        - name: sedeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series generadas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeSeriesResponseDto'
        "400":
          description: La sede ya tiene series asignadas
        "404":
          description: Sede no encontrada

  # ==================== USER PREFERENCE ====================
  /user_preference:
    get:
      tags:
        - user_preference
      summary: Listar preferencias por empresa
      operationId: listarPreferencias
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de preferencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPreferenceData'

    put:
      tags:
        - user_preference
      summary: Guardar o actualizar preferencia
      operationId: guardarPreferencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceSaveDto'
      responses:
        "200":
          description: Preferencia guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferenceData'

  # ==================== TIPO DE CAMBIO ====================
  /tipo_cambio:
    get:
      summary: Obtener tipo de cambio por fecha y moneda
      operationId: obtenerTipoCambio
      tags:
        - tipo_cambio
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Fecha del tipo de cambio (YYYY-MM-DD)
        - name: moneda
          in: query
          schema:
            type: string
            default: USD
          description: Moneda origen (ej. USD)
        - name: fuente
          in: query
          schema:
            type: string
          description: Fuente del tipo de cambio (SBS o SUNAT)
      responses:
        "200":
          description: Tipo de cambio encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoCambioResponseDto'

    post:
      summary: Registrar tipo de cambio
      operationId: registrarTipoCambio
      tags:
        - tipo_cambio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoCambioCreateDto'
      responses:
        "200":
          description: Tipo de cambio registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoCambioResponseDto'

  /tipo_cambio/list:
    get:
      summary: Listar todos los tipos de cambio
      operationId: listarTiposCambio
      tags:
        - tipo_cambio
      parameters:
        - name: fuente
          in: query
          schema:
            type: string
          description: Filtrar por fuente (SBS o SUNAT)
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Lista de tipos de cambio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoCambioListResponseDto'

  # ==================== NOTIFICATION ====================
  /notification:
    get:
      tags:
        - notification
      summary: Listar notificaciones de transmisión por empresa
      operationId: listarNotificaciones
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponseDto'

    post:
      tags:
        - notification
      summary: Publicar una notificación de transmisión
      operationId: publicarNotificacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPublishDto'
      responses:
        "200":
          description: Notificación publicada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - notification
      summary: Limpiar notificaciones por empresa
      operationId: limpiarNotificaciones
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notificaciones limpiadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /notification/read-all:
    put:
      tags:
        - notification
      summary: Marcar todas las notificaciones como leídas
      operationId: marcarTodasLeidas
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Todas marcadas como leídas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /notification/{notificationId}/read:
    put:
      tags:
        - notification
      summary: Marcar una notificación como leída
      operationId: marcarNotificacionLeida
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notificación marcada como leída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== RENIEC ====================
  /reniec:
    get:
      tags:
        - reniec
      summary: Consultar documento RENIEC / SUNAT
      operationId: consultarDocumento
      parameters:
        - name: tipo
          in: query
          required: true
          schema:
            type: string
            enum: [DNI, RUC, CE, PASAPORTE]
          description: Tipo de documento a consultar
        - name: numero
          in: query
          required: true
          schema:
            type: string
          description: Número de documento
      responses:
        "200":
          description: Datos del documento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReniecResponseDto'
        "400":
          description: Error en la consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== TABLA SUNAT ====================
  /tabla_sunat/menu:
    get:
      tags:
        - tabla_sunat
      summary: Listar menú de tablas SUNAT disponibles
      operationId: listarMenuTablasSunat
      responses:
        "200":
          description: Lista de nombres de tablas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TablaSunatMenuItem'

  /tabla_sunat:
    get:
      tags:
        - tabla_sunat
      summary: Obtener una tabla SUNAT por nombre
      operationId: obtenerTablaSunat
      parameters:
        - name: nombreTabla
          in: query
          required: true
          schema:
            type: string
          description: Nombre exacto de la tabla SUNAT (ej. TIPO DE MONEDA)
      responses:
        "200":
          description: Datos de la tabla solicitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablaSunatResponseDto'
        "404":
          description: Tabla no encontrada

  # ==================== CATÁLOGO SUNAT ====================
  /catalogo_sunat/menu:
    get:
      tags:
        - catalogo_sunat
      summary: Listar menú de catálogos SUNAT disponibles
      operationId: listarMenuCatalogosSunat
      responses:
        "200":
          description: Lista de nombres de catálogos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoSunatMenuItem'

  /catalogo_sunat:
    get:
      tags:
        - catalogo_sunat
      summary: Obtener un catálogo SUNAT por nombre
      operationId: obtenerCatalogoSunat
      parameters:
        - name: nombreCatalogo
          in: query
          required: true
          schema:
            type: string
          description: Nombre del catálogo SUNAT (ej. Catálogo No. 01)
      responses:
        "200":
          description: Datos del catálogo solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoSunatResponseDto'
        "404":
          description: Catálogo no encontrado

  # ==================== ONBOARDING ====================
  /onboarding:
    post:
      tags:
        - onboarding
      summary: Registrar nueva empresa con configuración inicial completa
      description: |
        Crea empresa, sede principal, 4 series (F001, B001, FC01, FD01)
        y 4 correlativos iniciales en una sola operación transaccional.
      operationId: registrarOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequestDto'
      responses:
        "200":
          description: Empresa registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponseDto'
        "400":
          description: Error de validación en datos de onboarding

components:
  schemas:
    # ===== GENERIC =====
    SuccessResponse:
      type: object
      required: [isSuccess, status, message, timestamp]
      properties:
        isSuccess:
          type: boolean
          example: true
        status:
          type: string
          example: "OK"
        message:
          type: string
          example: "Operación exitosa"
        timestamp:
          type: string
          format: date-time
          example: "2026-04-04T10:30:00Z"

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "ERR-400"
        message:
          type: string
          example: "Error en la solicitud"
        timestamp:
          type: string
          format: date-time
          example: "2026-04-04T10:30:00Z"
        errors:
          type: array
          items:
            type: string
          example: ["El campo ruc es requerido", "Formato de RUC inválido"]

    # ===== COMPANY =====
    CompanyRegisterDto:
      type: object
      required:
        - ruc
        - razonSocial
        - nombreComercial
        - codigoUbigeo
        - direccion
        - urbanizacion
        - departamento
        - provincia
        - distrito
        - usuarioSol
        - claveSol
        - certificadoPath
        - certificadoPassword
      properties:
        ruc:
          type: string
          minLength: 11
          maxLength: 11
          pattern: "^[0-9]{11}$"
          description: Número de RUC de la empresa (11 dígitos)
          example: "20601234567"
        razonSocial:
          type: string
          maxLength: 300
          description: Razón social completa
          example: "EMPRESA EJEMPLO S.A.C."
        nombreComercial:
          type: string
          maxLength: 200
          description: Nombre comercial (opcional pero recomendado)
          example: "Empresa Ejemplo"
        codigoUbigeo:
          type: string
          pattern: "^[0-9]{6}$"
          description: Código de ubigeo SUNAT (6 dígitos)
          example: "150101"
        direccion:
          type: string
          maxLength: 250
          example: "Av. Principal 123, San Isidro"
        urbanizacion:
          type: string
          maxLength: 100
          example: "San Isidro"
        departamento:
          type: string
          example: "Lima"
        provincia:
          type: string
          example: "Lima"
        distrito:
          type: string
          example: "San Isidro"
        usuarioSol:
          type: string
          description: Usuario SOL (SUNAT Operaciones en Línea)
          example: "MIEMPRESAUSU"
        claveSol:
          type: string
          format: password
          description: Clave SOL
          example: "ClaveSOL123"
        certificadoPath:
          type: string
          description: Ruta o referencia del certificado .p12
          example: "/certs/20601234567.p12"
        certificadoPassword:
          type: string
          format: password
          example: "certPass123"
        emailContacto:
          type: string
          format: email
          example: "contacto@empresa.com"
        telefono:
          type: string
          example: "5112345678"
        regimen:
          type: string
          enum: [general, mype_tributario, renta_especial]
          default: general
          example: "general"
        emisionEnEnvio:
          type: boolean
          description: |
            Si true (default), al crear un documento se genera el XML UBL 2.1 automáticamente.
            Si false, el documento se guarda como BORRADOR y debe emitirse manualmente.
          default: true
          example: true

    CompanyUpdateDto:
      type: object
      properties:
        nombreComercial:
          type: string
          example: "Nuevo Nombre Comercial"
        direccion:
          type: string
          example: "Calle Nueva 456"
        emailContacto:
          type: string
          format: email
          example: "nuevo@empresa.com"
        telefono:
          type: string
          example: "51987654321"
        usuarioSol:
          type: string
          example: "NUEVOUSUARIO"
        claveSol:
          type: string
          format: password
          example: "NuevaClave123"
        certificadoPassword:
          type: string
          format: password
          example: "NuevoCertPass"
        emisionEnEnvio:
          type: boolean
          description: "Activar/desactivar emisión automática al guardar documentos"
          example: true

    # ===== CLIENT =====
    ClientRegisterDto:
      type: object
      required:
        - companyId
        - tipoDocumento
        - numeroDocumento
        - denominacion
      properties:
        companyId:
          type: string
          example: "cmp_20601234567"
        tipoDocumento:
          type: string
          enum: [DNI, RUC, CE, PASAPORTE]
          example: "RUC"
        numeroDocumento:
          type: string
          example: "20601234567"
        denominacion:
          type: string
          description: Nombre o razón social del cliente
          example: "CLIENTE EJEMPLO S.R.L."
        direccion:
          type: string
          example: "Av. Los Clientes 789"
        email:
          type: string
          format: email
          example: "cliente@ejemplo.com"
        telefono:
          type: string
          example: "51987654321"
        departamento:
          type: string
          example: "LIMA"
        provincia:
          type: string
          example: "LIMA"
        distrito:
          type: string
          example: "MIRAFLORES"
        codigoPais:
          type: string
          description: "Catálogo 04 SUNAT: código ISO país"
          default: "PE"
          example: "PE"

    ClientUpdateDto:
      type: object
      properties:
        denominacion:
          type: string
          example: "NUEVO CLIENTE S.A.C."
        direccion:
          type: string
          example: "Calle Actualizada 123"
        email:
          type: string
          format: email
          example: "nuevo@cliente.com"
        telefono:
          type: string
          example: "51999999999"
        departamento:
          type: string
          example: "LIMA"
        provincia:
          type: string
          example: "LIMA"
        distrito:
          type: string
          example: "SAN ISIDRO"
        codigoPais:
          type: string
          example: "PE"

    # ===== FACTURA =====
    FacturaEmitirDto:
      type: object
      required:
        - companyId
        - clientId
        - serie
        - numero
        - fechaEmision
        - moneda
        - gravadas
        - igv
        - total
        - detalle
      properties:
        companyId:
          type: string
          minLength: 1
          example: "cmp_20601234567"
        clientId:
          type: string
          minLength: 1
          example: "cli_123456"
        serie:
          type: string
          pattern: "^[A-Za-z]\\d{3}$"
          example: "F001"
        numero:
          type: integer
          example: 1
        fechaEmision:
          type: string
          format: date
          example: "2026-04-04"
        moneda:
          type: string
          enum: [PEN, USD]
          example: "PEN"
        gravadas:
          type: number
          minimum: 0
          example: 1000.00
        igv:
          type: number
          minimum: 0
          example: 180.00
        total:
          type: number
          minimum: 0
          example: 1180.00
        detalle:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleItem'
        leyenda:
          type: string
          example: "SON MIL CIENTO OCHENTA Y 00/100 SOLES"
        formaPago:
          type: string
          enum: [CONTADO, CREDITO]
          default: "CONTADO"
          example: "CONTADO"
        tipoCambio:
          type: number
          minimum: 0
          description: Tipo de cambio del día (solo si moneda != PEN)
          example: 3.7520
        fechaVencimiento:
          type: string
          format: date
          description: Fecha de vencimiento. Si CONTADO = fechaEmision
          example: "2026-04-04"
        codigoUbigeo:
          type: string
          description: Código ubigeo SUNAT de la sede emisora
          example: "150101"
        tipoOperacion:
          type: string
          description: "Catálogo 51 SUNAT: 0101=Venta interna, 0200=Exportación, etc."
          default: "0101"
          example: "0101"
        horaEmision:
          type: string
          description: "Hora de emisión HH:mm:ss"
          example: "12:58:00"
        exoneradas:
          type: number
          description: Subtotal operaciones exoneradas (Cat. 05 - 9997)
          minimum: 0
          example: 0.00
        inafectas:
          type: number
          description: Subtotal operaciones inafectas (Cat. 05 - 9998)
          minimum: 0
          example: 0.00
        gratuitas:
          type: number
          description: Subtotal operaciones gratuitas (Cat. 05 - 9996)
          minimum: 0
          example: 0.00
        totalCargos:
          type: number
          description: Total de cargos globales (ej. recargo al consumo)
          minimum: 0
          example: 0.00
        totalDescuentos:
          type: number
          description: Total de descuentos globales
          minimum: 0
          example: 0.00
        subtotal:
          type: number
          description: Suma de LineExtensionAmount de todas las líneas
          minimum: 0
          example: 1000.00
        totalConImpuestos:
          type: number
          description: TaxInclusiveAmount (subtotal + impuestos)
          minimum: 0
          example: 1180.00
        cuotas:
          type: array
          description: "Cuotas de crédito (solo si formaPago=CREDITO). Suma de montos debe = total."
          items:
            $ref: '#/components/schemas/CuotaCredito'
        cargosDescuentos:
          type: array
          description: "Cargos y/o descuentos globales (Cat. 53 SUNAT)"
          items:
            $ref: '#/components/schemas/AllowanceChargeItem'
        emitir:
          type: boolean
          description: |
            Si true (default), genera XML UBL 2.1 y notifica la emisión.
            Si false, guarda como BORRADOR sin generar XML.
            Controlado por la preferencia "Emisión en Envío" del panel de configuración.
          default: true
          example: true

    # ===== BOLETA =====
    BoletaEmitirDto:
      type: object
      required:
        - companyId
        - clientId
        - serie
        - numero
        - total
      properties:
        companyId:
          type: string
          example: "cmp_20601234567"
        clientId:
          type: string
          example: "cli_123456"
        serie:
          type: string
          example: "B001"
        numero:
          type: integer
          example: 1
        fechaEmision:
          type: string
          format: date
          example: "2026-04-04"
        moneda:
          type: string
          enum: [PEN, USD]
          default: "PEN"
        gravadas:
          type: number
          example: 500.00
        igv:
          type: number
          example: 90.00
        total:
          type: number
          example: 590.00
        detalle:
          type: array
          items:
            $ref: '#/components/schemas/DetalleItem'
        leyenda:
          type: string
          example: "SON QUINIENTOS NOVENTA Y 00/100 SOLES"
        formaPago:
          type: string
          enum: [CONTADO, CREDITO]
          default: "CONTADO"
        tipoCambio:
          type: number
          description: Tipo de cambio (solo si moneda != PEN)
          example: 3.7520
        fechaVencimiento:
          type: string
          format: date
          example: "2026-04-04"
        codigoUbigeo:
          type: string
          description: Código ubigeo SUNAT de la sede emisora
          example: "150101"
        tipoOperacion:
          type: string
          description: "Catálogo 51 SUNAT: 0101=Venta interna"
          default: "0101"
