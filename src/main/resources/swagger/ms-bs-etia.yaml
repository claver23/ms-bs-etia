        - amount
      properties:
        chargeIndicator:
          type: boolean
          description: "true = Cargo (surcharge), false = Descuento (allowance)"
          example: true
        reasonCode:
          type: string
          description: "Catálogo 53 SUNAT: 00=Desc. global, 02=Desc. ítem, 46=Recargo consumo, 47=Cargos, 50=Percepción"
          example: "46"
        reasonDescription:
          type: string
          description: Descripción del cargo o descuento
          example: "Recargo al consumo"
        multiplierFactor:
          type: number
          description: Factor multiplicador (ej. 0.10 para 10%)
          example: 0.10
        amount:
          type: number
          description: Monto del cargo o descuento
          minimum: 0
          example: 100.00
        baseAmount:
          type: number
          description: Monto base sobre el que se calcula
          minimum: 0
          example: 1000.00

