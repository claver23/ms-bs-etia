  # ==================== NOTA CRÉDITO ====================
  /nota_credito:
    post:
      tags:
        - nota_credito
      summary: Emitir nota de crédito electrónica
      operationId: emitirNotaCredito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaCreditoEmitirDto'
      responses:
        "200":
          description: Nota de crédito emitida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaCreditoResponseDto'
        "400":
          description: Error de validación
        "500":
          description: Error interno

    get:
      tags:
        - nota_credito
      summary: Listar notas de crédito
      operationId: listarNotasCredito
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: facturaReferenciaId
          in: query
          schema:
            type: string
        - name: desdeFecha
          in: query
          schema:
            type: string
            format: date
        - name: hastaFecha
          in: query
          schema:
            type: string
            format: date
        - name: serie
          in: query
          schema:
            type: string
          description: Filtrar por serie
        - name: estado
          in: query
          schema:
            type: string
            enum: [BORRADOR, VALIDADO, CON_ERROR, ENVIADA, ACEPTADA, RECHAZADA, ANULADA]
          description: Filtrar por estado
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Lista de notas de crédito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaCreditoListResponseDto'

    put:
      tags:
        - nota_credito
      summary: Actualizar nota de crédito no enviada
      operationId: actualizarNotaCreditoBorrador
      parameters:
        - name: notaCreditoId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaCreditoUpdateDto'
      responses:
        "200":
          description: Nota de crédito actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaCreditoResponseDto'
        "400":
          description: Solo se pueden actualizar notas no enviadas a SUNAT
        "404":
          description: Nota de crédito no encontrada

    delete:
      tags:
        - nota_credito
      summary: Eliminar borrador de nota de crédito
      operationId: eliminarNotaCreditoBorrador
      parameters:
        - name: notaCreditoId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Borrador eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /nota_credito/{notaCreditoId}:
    get:
      tags:
        - nota_credito
      summary: Obtener nota de crédito por ID
      operationId: obtenerNotaCredito
      parameters:
        - name: notaCreditoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nota de crédito encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaCreditoResponseDto'
        "404":
          description: Nota de crédito no encontrada

  /nota_credito/{notaCreditoId}/validar:
    post:
      tags:
        - nota_credito
      summary: Validar una nota de crédito internamente (sin emitir a SUNAT)
      description: |
        Ejecuta todas las reglas de validación SUNAT sobre una nota de crédito existente
        y actualiza su estado a VALIDADO o CON_ERROR. No emite ni genera XML.
        Puede ejecutarse sobre notas en estado BORRADOR, CON_ERROR o VALIDADO.
      operationId: validarNotaCredito
      parameters:
        - name: notaCreditoId
          in: path
          required: true
          schema:
            type: string
          description: ID de la nota de crédito a validar
      responses:
        "200":
          description: Resultado de la validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentValidationResultDto'
        "404":
          description: Nota de crédito no encontrada

  /nota_credito/{notaCreditoId}/emitir:
    put:
      tags:
        - nota_credito
      summary: Emitir una nota de crédito en estado BORRADOR
      description: |
        Toma una nota de crédito existente con estado BORRADOR o VALIDADO, genera el XML UBL 2.1
        tipo CreditNote (07), lo persiste en disco y BD, y publica la notificación de emisión.
      operationId: emitirNotaCreditoBorrador
      parameters:
        - name: notaCreditoId
          in: path
          required: true
          schema:
            type: string
          description: ID de la nota de crédito borrador a emitir
      responses:
        "200":
          description: Nota de crédito emitida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaCreditoResponseDto'
        "400":
          description: La nota de crédito no está en estado BORRADOR o VALIDADO
        "404":
          description: Nota de crédito no encontrada

  /nota_credito/{notaCreditoId}/xml:
    get:
      tags:
        - nota_credito
      summary: Descargar XML UBL 2.1 de una nota de crédito
      description: |
        Retorna el XML UBL 2.1 tipo CreditNote (07) generado para la nota de crédito indicada.
        El nombre del archivo sigue el formato SUNAT: {RUC}-07-{serie}-{numero}.xml
      operationId: descargarNotaCreditoXml
      parameters:
        - name: notaCreditoId
          in: path
          required: true
          schema:
            type: string
          description: ID de la nota de crédito
      responses:
        "200":
          description: XML UBL 2.1 de la nota de crédito
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=\"{RUC}-07-{serie}-{numero}.xml\""
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "204":
          description: La nota de crédito existe pero aún no tiene XML generado
        "404":
          description: Nota de crédito no encontrada

