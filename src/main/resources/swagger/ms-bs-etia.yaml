        - libro_electronico
      summary: Generar libro electrónico (ventas/compras)
      operationId: generarLibroElectronico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroGenerarDto'
      responses:
        "200":
          description: Archivo TXT/XML generado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroElectronicoResponseDto'
        "400":
          description: Error en la generación
        "500":
          description: Error interno

    get:
      tags:
        - libro_electronico
      summary: Obtener libros generados por periodo
      operationId: listarLibrosElectronicos
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            type: string
            enum: [ventas, compras, anexo]
        - name: periodo
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
            example: "2026-01"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
