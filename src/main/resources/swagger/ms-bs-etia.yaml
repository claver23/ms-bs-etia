openapi: 3.0.3
info:
  title: ETIA - Facturación Electrónica Perú
  version: 1.1.0
  description: Backend-driven SaaS onboarding with hybrid authentication and mandatory subscription. Incluye comprobantes electrónicos según SUNAT (factura, boleta, nota crédito, nota débito, libros electrónicos).
servers:
  - url: http://localhost:8080/api

tags:
  - name: company
    description: Empresas emisoras registradas en ETIA
  - name: client
    description: Clientes (adquirientes) de los comprobantes
  - name: factura
    description: Facturas electrónicas (FE) según SUNAT
  - name: boleta
    description: Boletas de venta electrónicas
  - name: nota_credito
    description: Notas de crédito electrónicas
  - name: nota_debito
    description: Notas de débito electrónicas
  - name: libro_electronico
    description: Libros electrónicos (ventas, compras, anexos)
  - name: product
    description: Catálogo de productos y servicios
  - name: employee
    description: Empleados y operadores del sistema
  - name: ubigeo
    description: Catálogo de ubigeos SUNAT
  - name: unidad_medida
    description: Catálogo de unidades de medida SUNAT
  - name: serie_config
    description: Configuración de series por tipo de documento
  - name: sede
    description: Sedes y sucursales de la empresa
  - name: user_preference
    description: Preferencias de usuario por empresa
  - name: tipo_cambio
    description: Tipos de cambio (SBS / SUNAT)
  - name: notification
    description: Notificaciones de transmisión de documentos
  - name: reniec
    description: Consulta de documentos RENIEC / SUNAT
  - name: tabla_sunat
    description: Catálogo de tablas parametrizadas SUNAT
  - name: catalogo_sunat
    description: Catálogos oficiales SUNAT para comprobantes electrónicos (CPE)
  - name: resumen_diario
    description: Resúmenes diarios de boletas para envío masivo a SUNAT
  - name: onboarding
    description: Registro de empresa con configuración inicial (onboarding)

paths:
  # ==================== COMPANY ====================
  /company:
    post:
      summary: Registrar nueva empresa emisora
      operationId: registrarEmpresa
      tags:
        - company
      requestBody:
        description: Datos de registro de la empresa
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRegisterDto'
      responses:
        "200":
          description: Empresa registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponseDto'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

    get:
      summary: Obtener lista de empresas (con paginación)
      operationId: listarEmpresas
      tags:
        - company
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: ruc
          in: query
          schema:
            type: string
          description: Filtrar por RUC
        - name: estado
          in: query
          schema:
            type: string
            enum: [ACTIVO, INACTIVO]
          description: Filtrar por estado
      responses:
        "200":
          description: Lista de empresas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponseDto'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

    put:
      summary: Actualizar datos de una empresa
      operationId: actualizarEmpresa
      tags:
        - company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
          description: ID de la empresa a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateDto'
      responses:
        "200":
          description: Empresa actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponseDto'
        "400":
          description: Bad Request
        "404":
          description: Empresa no encontrada
        "500":
          description: Internal Server Error

    delete:
      summary: Eliminar empresa (soft delete o lógico)
      operationId: eliminarEmpresa
      tags:
        - company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: softDelete
          in: query
          schema:
            type: boolean
            default: true
          description: Si es true, solo desactiva; si false, elimina físicamente
      responses:
        "200":
          description: Empresa eliminada (desactivada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          description: Empresa no encontrada
        "500":
          description: Internal Server Error

  /company/certificado:
    post:
      summary: Subir certificado digital (.p12/.pfx)
      operationId: subirCertificado
      tags:
        - company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
          description: ID de la empresa
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
              properties:
                archivo:
                  type: string
                  format: binary
                  description: "Archivo de certificado digital (.p12 o .pfx)"
      responses:
        "200":
          description: Certificado subido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponseDto'
        "400":
          description: Archivo inválido (no es .p12/.pfx o excede 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Empresa no encontrada
        "500":
          description: Internal Server Error

  /company/probar-conexion:
    post:
      summary: Probar conexión con SUNAT (web service beta)
      operationId: probarConexionSunat
      tags:
        - company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
          description: ID de la empresa
      responses:
        "200":
          description: Resultado de la prueba de conexión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConexionSunatResultDto'
        "404":
          description: Empresa no encontrada
        "500":
          description: Internal Server Error

  /company/logo:
    post:
      summary: Subir logo de empresa (PNG, JPG, SVG)
      operationId: subirLogo
      tags:
        - company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
              properties:
                archivo:
                  type: string
                  format: binary
                  description: "Archivo de logo (PNG, JPG o SVG, max 10MB)"
      responses:
        "200":
          description: Logo subido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponseDto'
        "400":
          description: Archivo inválido
        "404":
          description: Empresa no encontrada
        "500":
          description: Internal Server Error
    get:
      summary: Obtener logo de empresa
      operationId: obtenerLogo
      tags:
        - company
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen del logo
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "204":
          description: La empresa no tiene logo configurado
        "404":
          description: Empresa no encontrada

  # ==================== CLIENT ====================
  /client:
    post:
      summary: Registrar cliente (adquiriente)
      operationId: registrarCliente
      tags:
        - client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegisterDto'
      responses:
        "200":
          description: Cliente registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponseDto'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error

    get:
      summary: Listar clientes por empresa
      operationId: listarClientes
      tags:
        - client
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: tipoDocumento
          in: query
          schema:
            type: string
            enum: [DNI, RUC, CE, PASAPORTE]
        - name: numeroDocumento
          in: query
          schema:
            type: string
        - name: denominacion
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponseDto'
        "401":
          description: Unauthorized

    put:
      summary: Actualizar cliente
      operationId: actualizarCliente
      tags:
        - client
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateDto'
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponseDto'
        "404":
          description: Cliente no encontrado

    delete:
      summary: Eliminar cliente
      operationId: eliminarCliente
      tags:
        - client
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cliente eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          description: Cliente no encontrado

  # ==================== FACTURA ====================
  /factura:
    post:
      summary: Emitir factura electrónica
      operationId: emitirFactura
      tags:
        - factura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaEmitirDto'
      responses:
        "200":
          description: Factura emitida exitosamente (incluye CDR y resumen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaResponseDto'
        "400":
          description: Error de validación SUNAT
        "500":
          description: Error interno

    get:
      summary: Obtener facturas emitidas
      operationId: listarFacturas
      tags:
        - factura
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: desdeFecha
          in: query
          schema:
            type: string
            format: date
        - name: hastaFecha
          in: query
          schema:
            type: string
            format: date
        - name: serie
          in: query
          schema:
            type: string
        - name: numero
          in: query
          schema:
            type: integer
        - name: estado
          in: query
          schema:
            type: string
            enum: [BORRADOR, ENVIADA, ACEPTADA, RECHAZADA, ANULADA]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Lista de facturas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaListResponseDto'

    put:
      summary: Anular factura (nota de crédito automática)
      operationId: anularFactura
      tags:
        - factura
      parameters:
        - name: facturaId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnularFacturaDto'
      responses:
        "200":
          description: Factura anulada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaResponseDto'
        "400":
          description: No se puede anular la factura
        "404":
          description: Factura no encontrada

    delete:
      summary: Eliminar factura (solo si no fue enviada a SUNAT)
      operationId: eliminarFactura
      tags:
        - factura
      parameters:
        - name: facturaId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Factura eliminada localmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: No se puede eliminar una factura ya enviada a SUNAT
        "404":
          description: Factura no encontrada

  /factura/{facturaId}:
    get:
      tags:
        - factura
      summary: Obtener factura por ID
      operationId: obtenerFactura
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Factura encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaResponseDto'
        "404":
          description: Factura no encontrada

  /factura/{facturaId}/xml:
    get:
      tags:
        - factura
      summary: Descargar XML UBL 2.1 de una factura
      description: |
        Retorna el XML UBL 2.1 generado para la factura indicada.
        El nombre del archivo sigue el formato SUNAT: {serie}-{numero}.xml
      operationId: descargarFacturaXml
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la factura
      responses:
        "200":
          description: XML UBL 2.1 de la factura
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=\"{serie}-{numero}.xml\""
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "204":
          description: La factura existe pero aún no tiene XML generado
        "404":
          description: Factura no encontrada

  /factura/{facturaId}/emitir:
    put:
      tags:
        - factura
      summary: Emitir una factura en estado BORRADOR
      description: |
        Toma una factura existente con estado BORRADOR, genera el XML UBL 2.1,
        lo persiste en disco y BD, y publica la notificación de emisión.
        Solo facturas con estado=BORRADOR pueden ser promovidas.
      operationId: emitirFacturaBorrador
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la factura borrador a emitir
      responses:
        "200":
          description: Factura emitida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaResponseDto'
        "400":
          description: La factura no está en estado BORRADOR
        "404":
          description: Factura no encontrada

  /factura/{facturaId}/actualizar:
    put:
      tags:
        - factura
      summary: Actualizar datos de una factura en estado BORRADOR
      description: |
        Actualiza todos los campos mutables de una factura existente en estado BORRADOR
        o RECHAZADA sin emitirla. Reemplaza cuotas y cargos/descuentos.
        No modifica serie, número, estado, fecha de emisión ni fecha de creación.
      operationId: actualizarFacturaBorrador
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la factura borrador a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaEmitirDto'
      responses:
        "200":
          description: Borrador actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaResponseDto'
        "400":
          description: La factura no está en estado BORRADOR o RECHAZADA
        "404":
          description: Factura no encontrada

  /factura/{facturaId}/validar:
    post:
      tags:
        - factura
      summary: Validar una factura internamente (sin emitir a SUNAT)
      description: |
        Ejecuta todas las reglas de validación SUNAT sobre una factura existente
        y actualiza su estado a VALIDADO o CON_ERROR. No emite ni genera XML.
        Puede ejecutarse sobre facturas en estado BORRADOR, CON_ERROR o VALIDADO.
      operationId: validarFactura
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la factura a validar
      responses:
        "200":
          description: Resultado de la validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentValidationResultDto'
        "404":
          description: Factura no encontrada

  /factura/{facturaId}/pdf:
    get:
      tags:
        - factura
      summary: Descargar representación impresa PDF de la factura
      description: |
        Genera y descarga el PDF con representación impresa de la factura electrónica.
        Incluye logo, datos emisor/receptor, detalle, totales, QR con formato SUNAT y hash CDR.
      operationId: descargarFacturaPdf
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la factura
      responses:
        "200":
          description: PDF generado exitosamente
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "inline; filename=\"{serie}-{numero}.pdf\""
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "204":
          description: Factura no tiene datos suficientes para generar PDF
        "404":
          description: Factura no encontrada

  # ==================== BOLETA ====================
  /boleta:
    post:
      tags:
        - boleta
      summary: Emitir boleta de venta electrónica
      operationId: emitirBoleta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoletaEmitirDto'
      responses:
        "200":
          description: Boleta emitida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletaResponseDto'
        "400":
          description: Error de validación
        "500":
          description: Error interno

    get:
      tags:
        - boleta
      summary: Listar boletas emitidas
      operationId: listarBoletas
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
        - name: desdeFecha
          in: query
          schema:
            type: string
            format: date
        - name: hastaFecha
          in: query
          schema:
            type: string
            format: date
        - name: serie
          in: query
          schema:
            type: string
        - name: numero
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Lista de boletas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletaListResponseDto'

    put:
      tags:
        - boleta
      summary: Anular boleta
      operationId: anularBoleta
      parameters:
        - name: boletaId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnularBoletaDto'
      responses:
        "200":
          description: Boleta anulada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletaResponseDto'

    delete:
      tags:
        - boleta
      summary: Eliminar borrador de boleta
      operationId: eliminarBoletaBorrador
      parameters:
        - name: boletaId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Borrador eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: Solo se pueden eliminar borradores no enviados

  /boleta/{boletaId}:
    get:
      tags:
        - boleta
      summary: Obtener boleta por ID
      operationId: obtenerBoleta
      parameters:
        - name: boletaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Boleta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletaResponseDto'
        "404":
          description: Boleta no encontrada

  /boleta/{boletaId}/validar:
    post:
      tags:
        - boleta
      summary: Validar una boleta internamente (sin emitir a SUNAT)
      description: |
        Ejecuta todas las reglas de validación SUNAT sobre una boleta existente
        y actualiza su estado a VALIDADO o CON_ERROR. No emite ni genera XML.
        Puede ejecutarse sobre boletas en estado BORRADOR, CON_ERROR o VALIDADO.
      operationId: validarBoleta
      parameters:
        - name: boletaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la boleta a validar
      responses:
        "200":
          description: Resultado de la validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentValidationResultDto'
        "404":
          description: Boleta no encontrada

  /boleta/{boletaId}/actualizar:
    put:
      tags:
        - boleta
      summary: Actualizar datos de una boleta en estado BORRADOR o CON_ERROR
      description: |
        Actualiza todos los campos mutables de una boleta existente.
        Reemplaza cuotas y cargos/descuentos. Re-ejecuta validación interna.
        No modifica serie, número, fecha de emisión ni fecha de creación.
      operationId: actualizarBoletaBorrador
      parameters:
        - name: boletaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la boleta borrador a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoletaEmitirDto'
      responses:
        "200":
          description: Borrador actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletaResponseDto'
        "400":
          description: La boleta no está en estado editable
        "404":
          description: Boleta no encontrada

  /boleta/{boletaId}/xml:
    get:
      tags:
        - boleta
      summary: Descargar XML UBL 2.1 de una boleta
      description: |
        Descarga el XML UBL 2.1 tipo "03" generado para la boleta.
        Si la boleta aún no tiene XML generado (BORRADOR), retorna 204.
      operationId: descargarBoletaXml
      parameters:
        - name: boletaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: XML UBL 2.1 de la boleta
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"20601234567-03-B001-00000001.xml\""
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "204":
          description: La boleta aún no tiene XML generado
        "404":
          description: Boleta no encontrada

  /boleta/{boletaId}/pdf:
    get:
      tags:
        - boleta
      summary: Descargar representación impresa PDF de la boleta
      description: |
        Genera y descarga el PDF con representación impresa de la boleta de venta electrónica.
        Incluye logo, datos emisor/receptor, detalle, totales, QR con formato SUNAT y hash CDR.
      operationId: descargarBoletaPdf
      parameters:
        - name: boletaId
          in: path
          required: true
          schema:
            type: string
          description: ID de la boleta
      responses:
        "200":
          description: PDF generado exitosamente
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "inline; filename=\"{serie}-{numero}.pdf\""
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "204":
          description: Boleta no tiene datos suficientes para generar PDF
        "404":
          description: Boleta no encontrada

