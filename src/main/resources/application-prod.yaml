# ═══════════════════════════════════════════════
# ETIA — Perfil PRODUCCIÓN (PostgreSQL + Flyway-ready)
# Activar con: SPRING_PROFILES_ACTIVE=prod
# ═══════════════════════════════════════════════

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:etia}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:etia}
    password: ${DB_PASS:etia_secret}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: never          # NO ejecutar data.sql en producción
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false       # Desactivar H2 console en prod
  thymeleaf:
    cache: true            # Cache activado en prod

# ── ETIA Storage ──
etia:
  storage:
    base-path: ${ETIA_STORAGE_PATH:/app/storage}
