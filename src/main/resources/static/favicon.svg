<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: dark rounded rect -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
  <!-- Calculator body -->
  <rect x="6" y="4" width="20" height="24" rx="3" fill="#16213e" stroke="#00ff88" stroke-width="0.8"/>
  <!-- Screen -->
  <rect x="8" y="6" width="16" height="6" rx="1.5" fill="#0d1117"/>
  <text x="22" y="11" font-family="monospace" font-size="5" fill="#00ff88" text-anchor="end" font-weight="bold">S/.</text>
  <!-- Button grid (4x3) -->
  <!-- Row 1 -->
  <rect x="8"  y="14" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <rect x="14" y="14" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <rect x="20" y="14" width="4" height="3" rx="0.8" fill="#00ff88" opacity="0.3"/>
  <!-- Row 2 -->
  <rect x="8"  y="18.5" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <rect x="14" y="18.5" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <rect x="20" y="18.5" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <!-- Row 3 -->
  <rect x="8"  y="23" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <rect x="14" y="23" width="4" height="3" rx="0.8" fill="#2a2a4a"/>
  <rect x="20" y="23" width="4" height="3" rx="0.8" fill="#00ff88" opacity="0.5"/>
</svg>

