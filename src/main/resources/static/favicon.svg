<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>

  <!-- ═══ WIFI — big, BEHIND calculator, from left going upper-right ═══ -->
  <!-- Arcs open RIGHT, then rotate -45° → they go UPPER-RIGHT -->
  <g transform="rotate(-45 5 21)">
    <!-- Signal dot (origin, mostly hidden behind calc) -->
    <circle cx="5" cy="21" r="1.6" fill="#00ff88"/>
    <!-- Arc 1 — close, bright -->
    <path d="M11 14.5 A9 9 0 0 1 11 27.5"
          fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <!-- Arc 2 — medium -->
    <path d="M16.5 10 A15 15 0 0 1 16.5 32"
          fill="none" stroke="#00ff88" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
    <!-- Arc 3 — far, faint -->
    <path d="M22 5.5 A21 21 0 0 1 22 36.5"
          fill="none" stroke="#00ff88" stroke-width="1.1" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- ═══ CALCULATOR (on top, covers center of wifi arcs) ═══ -->
  <rect x="7" y="7" width="18" height="21" rx="3" fill="#16213e" stroke="#00ff88" stroke-width="0.7"/>

  <!-- Screen -->
  <rect x="9" y="9" width="14" height="5" rx="1.2" fill="#0d1117"/>
  <text x="21.5" y="13.2" font-family="monospace" font-size="4.8" fill="#00ff88" text-anchor="end" font-weight="bold">$</text>

  <!-- Button grid (3×3) -->
  <rect x="9"    y="16"   width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="13.5" y="16"   width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="18"   y="16"   width="3.5" height="2.5" rx="0.6" fill="#00ff88" opacity="0.3"/>
  <rect x="9"    y="19.8" width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="13.5" y="19.8" width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="18"   y="19.8" width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="9"    y="23.6" width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="13.5" y="23.6" width="3.5" height="2.5" rx="0.6" fill="#2a2a4a"/>
  <rect x="18"   y="23.6" width="3.5" height="2.5" rx="0.6" fill="#00ff88" opacity="0.5"/>
</svg>
