# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS — SCHEMAS
# ══════════════════════════════════════════════════════════════════════════════
components:
  schemas:

    # ╔════════════════════════════════════════════════════════════════════════╗
    # ║  SCHEMAS GENÉRICOS — NO MODIFICAR                                    ║
    # ║  Estos schemas son estándar del framework. Copiar tal cual.          ║
    # ╚════════════════════════════════════════════════════════════════════════╝

    # ── Wrapper de respuesta exitosa ──
    SuccessResponse:
      type: object
      required: [isSuccess, status, message, timestamp]
      properties:
        isSuccess:
          type: boolean
          example: true
        status:
          type: string
          example: "OK"
        message:
          type: string
          example: "Operación exitosa"
        timestamp:
          type: string
          format: date-time
          example: "2026-01-01T10:30:00Z"

    # ── Wrapper de respuesta de error ──
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "ERR-400"
        message:
          type: string
          example: "Error en la solicitud"
        timestamp:
          type: string
          format: date-time
          example: "2026-01-01T10:30:00Z"
        errors:
          type: array
          items:
            type: string
          example: ["Campo requerido faltante", "Formato inválido"]

    # ── Metadata de paginación ──
    PaginationMeta:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
          example: 50
        totalPages:
          type: integer
          example: 5
        currentPage:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 10

    # ── Resultado de validación interna ──
    DocumentValidationResultDto:
      type: object
      description: "Resultado de validación interna de un recurso"
      properties:
        valid:
          type: boolean
          description: "true si pasó todas las validaciones"
          example: true
        errores:
          type: array
          description: "Errores que bloquean la operación"
          items:
            type: string
          example: []
        advertencias:
          type: array
          description: "Advertencias que no bloquean pero recomiendan corrección"
          items:
            type: string
          example: []

    # ╔════════════════════════════════════════════════════════════════════════╗
    # ║  SCHEMAS DE DOMINIO MAESTRO (CRUD)                                   ║
    # ║  Copiar y adaptar este bloque para cada entidad maestra.             ║
    # ║  Reemplazar: {Dominio}, {prefijo_id}                                ║
    # ╚════════════════════════════════════════════════════════════════════════╝

    # ── Request: Crear ──
    {Dominio}CreateDto:
      type: object
      required:
        - companyId
        - nombre
        # - {campo_requerido_n}
      properties:
        companyId:
          type: string
          minLength: 1
          description: "ID de la empresa propietaria"
          example: "cmp_20601234567"
        nombre:
          type: string
          minLength: 1
          maxLength: 300
          description: "Nombre del {dominio}"
          example: "Ejemplo de {dominio}"
        descripcion:
          type: string
          maxLength: 500
          description: "Descripción (opcional)"
          example: "Descripción del {dominio}"
        # ── Agregar campos específicos del dominio ──
        # {campo_string}:
        #   type: string
        #   example: "valor"
        # {campo_numero}:
        #   type: number
        #   minimum: 0
        #   example: 100.00
        # {campo_fecha}:
        #   type: string
        #   format: date
        #   example: "2026-01-01"
        # {campo_enum}:
        #   type: string
        #   enum: [VALOR_1, VALOR_2]
        #   default: "VALOR_1"
        #   example: "VALOR_1"
        # {campo_boolean}:
        #   type: boolean
        #   default: true
        #   example: true
        # {campo_array}:
        #   type: array
        #   minItems: 1
        #   items:
        #     $ref: '#/components/schemas/{SubItem}'

    # ── Request: Actualizar (todos los campos opcionales) ──
    {Dominio}UpdateDto:
      type: object
      properties:
        nombre:
          type: string
          example: "Nombre actualizado"
        descripcion:
          type: string
          example: "Descripción actualizada"
        # ── Copiar campos de CreateDto SIN companyId, SIN required ──

    # ── Response Data: Modelo core ──
    {Dominio}Data:
      type: object
      properties:
        # ── Identidad ──
        id:
          type: string
          example: "{prefijo_id}_001"
        companyId:
          type: string
          example: "cmp_20601234567"
        # ── Campos de negocio ──
        nombre:
          type: string
          example: "Ejemplo de {dominio}"
        descripcion:
          type: string
          example: "Descripción del {dominio}"
        # ── Estado ──
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
          example: "ACTIVO"
        # ── Auditoría ──
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-01-01T10:30:00Z"
        fechaActualizacion:
          type: string
          format: date-time
          example: "2026-01-01T12:00:00Z"

    # ── Response Wrapper: Individual ──
    {Dominio}ResponseDto:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/{Dominio}Data'

    # ── Response Wrapper: Lista paginada ──
    {Dominio}ListResponseDto:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/{Dominio}Data'
                pagination:
                  $ref: '#/components/schemas/PaginationMeta'

