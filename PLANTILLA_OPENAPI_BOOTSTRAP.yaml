# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📐 PLANTILLA OPENAPI BOOTSTRAP — ESTÁNDAR ETLIONS                        ║
# ║                                                                            ║
# ║  Instrucciones:                                                            ║
# ║  1. Copiar este archivo a src/main/resources/swagger/ms-bs-{nombre}.yaml   ║
# ║  2. Buscar y reemplazar TODOS los {placeholders}                           ║
# ║  3. Eliminar los dominios de ejemplo que no apliquen                       ║
# ║  4. Agregar dominios adicionales copiando las secciones marcadas           ║
# ║  5. NO modificar los schemas genéricos (SuccessResponse, ErrorResponse,    ║
# ║     PaginationMeta, DocumentValidationResultDto)                           ║
# ║                                                                            ║
# ║  Placeholders globales a reemplazar:                                       ║
# ║    {proyecto_titulo}     → Nombre del proyecto                             ║
# ║    {proyecto_version}    → Versión semántica (ej: 1.0.0)                   ║
# ║    {proyecto_descripcion}→ Descripción técnica del servicio                ║
# ║    {puerto}              → Puerto del servidor (ej: 8080)                  ║
# ║                                                                            ║
# ║  Placeholders por dominio (buscar/reemplazar por bloque):                  ║
# ║    {dominio}         → nombre en snake_case (ej: producto, orden_compra)   ║
# ║    {Dominio}         → nombre en PascalCase (ej: Producto, OrdenCompra)    ║
# ║    {dominio_plural}  → plural en snake_case (ej: productos)               ║
# ║    {DominioPlural}   → plural en PascalCase (ej: Productos)               ║
# ║    {prefijo_id}      → prefijo corto de ID (ej: prd, orc)                 ║
# ║    {dominio_desc}    → descripción del tag                                ║
# ║                                                                            ║
# ║  Ref: ESPECIFICACION_TECNICA.md — Secciones 15-23                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

openapi: 3.0.3
info:
  title: "{proyecto_titulo}"
  version: "{proyecto_version}"
  description: "{proyecto_descripcion}"
servers:
  - url: http://localhost:{puerto}/api

# ══════════════════════════════════════════════════════════════════════════════
# TAGS — Declarar un tag por cada dominio del proyecto
# ══════════════════════════════════════════════════════════════════════════════
tags:
  # ── Dominio maestro (CRUD completo) ──
  - name: {dominio}
    description: "{dominio_desc}"

  # ── Dominio documento (CRUD + lifecycle: validar/emitir/xml) ──
  # - name: {doc_dominio}
  #   description: "{doc_dominio_desc}"

  # ── Catálogo estático (solo lectura) ──
  # - name: {catalogo}
  #   description: "{catalogo_desc}"

# ══════════════════════════════════════════════════════════════════════════════
# PATHS
# ══════════════════════════════════════════════════════════════════════════════
paths:

  # ╔════════════════════════════════════════════════════════════════════════╗
  # ║  BLOQUE A — DOMINIO MAESTRO (CRUD)                                   ║
  # ║  Copiar este bloque entero para cada entidad maestra del sistema.    ║
  # ║  Reemplazar: {dominio}, {Dominio}, {DominioPlural}, {prefijo_id}    ║
  # ╚════════════════════════════════════════════════════════════════════════╝

  # ==================== {DOMINIO} ====================
  /{dominio}:
    # ── TIPO 1: Crear recurso ──
    post:
      summary: "Crear {dominio}"
      operationId: crear{Dominio}
      tags:
        - {dominio}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{Dominio}CreateDto'
            example:
              companyId: "cmp_20601234567"
              nombre: "Ejemplo de {dominio}"
              descripcion: "Descripción del {dominio}"
      responses:
        "200":
          description: "{Dominio} creado exitosamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Dominio}ResponseDto'
              example:
                isSuccess: true
                status: "OK"
                message: "Operación exitosa"
                timestamp: "2026-01-01T10:30:00Z"
                data:
                  id: "{prefijo_id}_001"
                  companyId: "cmp_20601234567"
                  nombre: "Ejemplo de {dominio}"
                  descripcion: "Descripción del {dominio}"
                  estado: "ACTIVO"
                  fechaCreacion: "2026-01-01T10:30:00Z"
        "400":
          description: "Error de validación"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "ERR-400"
                message: "Error de validación en los campos enviados"
                timestamp: "2026-01-01T10:30:00Z"
                errors:
                  - "nombre: no puede ser vacío"
                  - "companyId: es requerido"
        "500":
          description: "Error interno"

    # ── TIPO 2: Listar con paginación ──
    get:
      summary: "Listar {dominio_plural}"
      operationId: listar{DominioPlural}
      tags:
        - {dominio}
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
          description: "ID de la empresa"
          example: "cmp_20601234567"
        - name: estado
          in: query
          schema:
            type: string
            enum: [ACTIVO, INACTIVO]
          description: "Filtrar por estado"
          example: "ACTIVO"
        # ── Agregar filtros de fecha si el dominio es temporal ──
        # - name: desdeFecha
        #   in: query
        #   schema:
        #     type: string
        #     format: date
        #   example: "2026-01-01"
        # - name: hastaFecha
        #   in: query
        #   schema:
        #     type: string
        #     format: date
        #   example: "2026-12-31"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          example: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        "200":
          description: "Lista de {dominio_plural}"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Dominio}ListResponseDto'
              example:
                isSuccess: true
                status: "OK"
                message: "Operación exitosa"
                timestamp: "2026-01-01T10:30:00Z"
                data:
                  content:
                    - id: "{prefijo_id}_001"
                      companyId: "cmp_20601234567"
                      nombre: "Ejemplo 1"
                      estado: "ACTIVO"
                    - id: "{prefijo_id}_002"
                      companyId: "cmp_20601234567"
                      nombre: "Ejemplo 2"
                      estado: "ACTIVO"
                  pagination:
                    totalElements: 50
                    totalPages: 5
                    currentPage: 0
                    pageSize: 10
        "401":
          description: "Unauthorized"

    # ── TIPO 4A: Actualizar recurso (ID en query) ──
    put:
      summary: "Actualizar {dominio}"
      operationId: actualizar{Dominio}
      tags:
        - {dominio}
      parameters:
        - name: {dominio}Id
          in: query
          required: true
          schema:
            type: string
          description: "ID del {dominio} a actualizar"
          example: "{prefijo_id}_001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{Dominio}UpdateDto'
            example:
              nombre: "Nombre actualizado"
              descripcion: "Descripción actualizada"
      responses:
        "200":
          description: "{Dominio} actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Dominio}ResponseDto'
              example:
                isSuccess: true
                status: "OK"
                message: "Operación exitosa"
                timestamp: "2026-01-01T10:30:00Z"
                data:
                  id: "{prefijo_id}_001"
                  nombre: "Nombre actualizado"
                  estado: "ACTIVO"
        "400":
          description: "No se puede actualizar"
        "404":
          description: "{Dominio} no encontrado"

    # ── TIPO 5: Eliminar recurso ──
    delete:
      summary: "Eliminar {dominio}"
      operationId: eliminar{Dominio}
      tags:
        - {dominio}
      parameters:
        - name: {dominio}Id
          in: query
          required: true
          schema:
            type: string
          example: "{prefijo_id}_001"
        - name: softDelete
          in: query
          schema:
            type: boolean
            default: true
          description: "true = desactiva (soft), false = elimina físicamente"
          example: true
      responses:
        "200":
          description: "{Dominio} eliminado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                isSuccess: true
                status: "OK"
                message: "{Dominio} eliminado exitosamente"
                timestamp: "2026-01-01T10:30:00Z"
        "404":
          description: "{Dominio} no encontrado"

  # ── TIPO 3: Obtener por ID ──
  /{dominio}/{"{dominio}Id"}:
    get:
      summary: "Obtener {dominio} por ID"
      operationId: obtener{Dominio}
      tags:
        - {dominio}
      parameters:
        - name: "{dominio}Id"
          in: path
          required: true
          schema:
            type: string
          description: "ID del {dominio}"
          example: "{prefijo_id}_001"
      responses:
        "200":
          description: "{Dominio} encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{Dominio}ResponseDto'
              example:
                isSuccess: true
                status: "OK"
                message: "Operación exitosa"
                timestamp: "2026-01-01T10:30:00Z"
                data:
                  id: "{prefijo_id}_001"
                  companyId: "cmp_20601234567"
                  nombre: "Ejemplo"
                  descripcion: "Descripción"
                  estado: "ACTIVO"
                  fechaCreacion: "2026-01-01T10:30:00Z"
        "404":
          description: "{Dominio} no encontrado"

  # ╔════════════════════════════════════════════════════════════════════════╗
  # ║  BLOQUE B — DOMINIO DOCUMENTO (CRUD + Lifecycle)                     ║
  # ║  Copiar este bloque para cada documento con máquina de estados.      ║
  # ║  Incluye: emitir, listar, obtener, actualizar, eliminar,            ║
  # ║           validar, emitir borrador, descargar archivo, anular        ║
  # ║  Reemplazar: {doc}, {Doc}, {DocPlural}, {doc_prefijo_id}            ║
  # ║              {doc_serie_ejemplo} (ej: F001, B001, FC01, FD01)        ║
  # ╚════════════════════════════════════════════════════════════════════════╝

